[project]
name = "fast-inkling-2-mini"
version = "0.1.0"
description = "Fast local inference for Thinking Machines' Inkling 2 Mini on Apple silicon (MLX + Metal kernels)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mlx>=0.32.4",
    "huggingface_hub",
    # mlx-vlm fork that ships the inkling2_loop model
    "mlx-vlm @ git+https://github.com/internet-projects/inkling2-mlx@v0.1.0",
    # the Inkling 2 image processor (loaded even for text) needs torchvision
    "torch",
    "torchvision",
]

[project.scripts]
inkling-fast = "inkling_fast.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
